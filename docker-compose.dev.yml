version: "3.9"

# Development Environment Configuration
# Uses local .env files and enables hot-reload

networks:
  appnet:

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
      args:
        NODE_VERSION: 20.11.1
    container_name: umattend_server_dev
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: ${SERVER_PORT:-4000}
    volumes:
      - ./server:/app
      - /app/node_modules
      - /app/dist
    networks: [appnet]
    ports:
      - "4000:4000"  # Expose for direct access during development
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
      args:
        NODE_VERSION: 20.11.1
        API_URL: http://server:4000
    container_name: umattend_client_dev
    restart: unless-stopped
    env_file:
      - ./client/.env
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: ${CLIENT_PORT:-3000}
      # Override API URLs to use Docker service names
      API_URL: http://server:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      WATCHPACK_POLLING: true
      CHOKIDAR_USEPOLLING: true
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      server:
        condition: service_healthy
    networks: [appnet]
    ports:
      - "3000:3000"  # Expose for direct access during development

  nginx:
    image: nginx:1.25.5-alpine
    container_name: umattend_nginx_dev
    restart: unless-stopped
    depends_on:
      - client
      - server
    ports:
      - "8080:80"  # Development on port 8080
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
