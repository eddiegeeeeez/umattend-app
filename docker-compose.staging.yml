services:
  client:
    build:
      context: ./client
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: https://staging.umattend.site
    image: umattend-client:staging
    container_name: umattend_client_staging
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./client/.env.staging
    environment:
      PORT: "3000"
      NODE_ENV: production
    networks:
      - umattend_net

  server:
    build:
      context: ./server
    image: umattend-server:staging
    container_name: umattend_server_staging
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - ./server/.env.staging
    environment:
      PORT: "4000"
    networks:
      - umattend_net

  nginx:
    image: nginx:1.27-alpine
    container_name: umattend_nginx_staging
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    networks:
      - umattend_net

networks:
  umattend_net:
    driver: bridge
