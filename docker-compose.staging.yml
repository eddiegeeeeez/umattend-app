# Staging Environment Configuration
# Production-ready setup with proper health checks, dependencies, and error handling

networks:
  appnet:
    driver: bridge

volumes:
  letsencrypt:
  certbot-www:

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 20.11.1
    container_name: umattend_server_staging
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: staging
      PORT: 4000
    networks: [appnet]
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 20.11.1
    container_name: umattend_client_staging
    restart: unless-stopped
    env_file:
      - ./client/.env
    environment:
      NODE_ENV: staging
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_URL: http://server:4000
    depends_on:
      server:
        condition: service_healthy
    networks: [appnet]
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.25.5-alpine
    container_name: umattend_nginx_staging
    restart: unless-stopped
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Graceful shutdown to allow certificate operations
    stop_signal: SIGTERM
    stop_grace_period: 30s

  certbot:
    image: certbot/certbot:latest
    container_name: umattend_certbot_staging
    restart: "no"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks: [appnet]
    command: tail -f /dev/null
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"