services:
  client:
    build:
      context: ./client
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: https://staging.umattend.site
    image: umattend-client:staging
    container_name: umattend_client_staging
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      PORT: "3001"
      NODE_ENV: production
    networks:
      - umattend_net

  server:
    build:
      context: ./server
    image: umattend-server:staging
    container_name: umattend_server_staging
    restart: unless-stopped
    expose:
      - "4001"
    env_file:
      - ./server/.env.staging
    environment:
      PORT: "4001"
    networks:
      - umattend_net

  nginx:
    image: nginx:1.27-alpine
    container_name: umattend_nginx_staging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - client
      - server
    networks:
      - umattend_net

  certbot:
    image: certbot/certbot:latest
    container_name: umattend_certbot_staging
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  certbot_conf:
  certbot_www:

networks:
  umattend_net:
    driver: bridge
