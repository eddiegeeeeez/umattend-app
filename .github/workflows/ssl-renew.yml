name: SSL Certificate Renewal

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch:

jobs:
  renew-staging:
    name: Renew Let's Encrypt (Staging)
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH key to agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
        run: |
          sudo apt-get update && sudo apt-get install -y expect
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval $(ssh-agent -s)
          cat > /tmp/add-ssh-key.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout -1
          spawn ssh-add /home/runner/.ssh/deploy_key
          expect "Enter passphrase"
          send -- "$env(SSH_PASSPHRASE)\r"
          expect eof
          EOF
          chmod +x /tmp/add-ssh-key.exp
          /tmp/add-ssh-key.exp
          ssh-add -l
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Renew certificates (staging)
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'set -euo pipefail; \
             APP_PATH="'"'${{ secrets.STAGING_APP_PATH }}'"'"; \
             cd "$APP_PATH"; \
             docker compose -f docker-compose.staging.yml up -d nginx certbot; \
             docker compose -f docker-compose.staging.yml run --rm certbot renew --webroot -w /var/www/certbot || true; \
             docker compose -f docker-compose.staging.yml exec -T nginx nginx -s reload || docker compose -f docker-compose.staging.yml restart nginx'

  renew-production:
    name: Renew Let's Encrypt (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH key to agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
        run: |
          sudo apt-get update && sudo apt-get install -y expect
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval $(ssh-agent -s)
          cat > /tmp/add-ssh-key.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout -1
          spawn ssh-add /home/runner/.ssh/deploy_key
          expect "Enter passphrase"
          send -- "$env(SSH_PASSPHRASE)\r"
          expect eof
          EOF
          chmod +x /tmp/add-ssh-key.exp
          /tmp/add-ssh-key.exp
          ssh-add -l
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Renew certificates (production)
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'set -euo pipefail; \
             APP_PATH="'"'${{ secrets.PRODUCTION_APP_PATH }}'"'"; \
             cd "$APP_PATH"; \
             docker compose -f docker-compose.production.yml up -d nginx certbot; \
             docker compose -f docker-compose.production.yml run --rm certbot renew --webroot -w /var/www/certbot || true; \
             docker compose -f docker-compose.production.yml exec -T nginx nginx -s reload || docker compose -f docker-compose.production.yml restart nginx'