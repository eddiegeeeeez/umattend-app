# ====================
# DEPLOY TO STAGING
# ====================

name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ====================
        run: echo "SETUP SSH"

      - name: Set up SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.AZURE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.AZURE_DEPLOY_PORT }} -H ${{ secrets.AZURE_DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=10 -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} 'echo ✅ SSH OK' || exit 1

      - name: ====================
        run: echo "BUILD AND DEPLOY"

      - name: Deploy
        run: |
          ssh -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} << 'DEPLOY_SCRIPT'
          set -e
          cd ${{ secrets.STAGING_APP_PATH }}
          
          echo ""
          echo "===================="
          echo "PULL CODE"
          echo "===================="
          echo ""
          git fetch --all
          git reset --hard origin/staging
          
          echo ""
          echo ""
          echo "===================="
          echo "BUILD SERVER"
          echo "===================="
          echo ""
          echo ""
          cd server
          npm ci
          npm run prisma:generate
          npm run prisma:migrate:deploy
          npm run build
          cd ..
          
          echo ""
          echo ""
          echo "===================="
          echo "BUILD CLIENT"
          echo "===================="
          echo ""
          echo ""
          cd client
          npm ci
          npm run build
          cd ..
          
          echo ""
          echo ""
          echo "===================="
          echo "RESTART SERVICES"
          echo "===================="
          echo ""
          echo ""
          pm2 restart umattend-server-staging || pm2 start server --name umattend-server-staging -- start
          pm2 restart umattend-client-staging || pm2 start client --name umattend-client-staging -- start
          pm2 save
          
          echo ""
          echo ""
          echo "===================="
          echo "VERIFY DEPLOYMENT"
          echo "===================="
          echo ""
          echo ""
          pm2 ls
          sleep 3
          
          echo ""
          echo "✅ Deployment complete"
          DEPLOY_SCRIPT

      - name: ====================
        run: echo "VERIFY AND ROLLBACK"

      - name: Deployment Failed
        if: failure()
        run: |
          ssh -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} "
          echo 'Rolling back to previous version...'
          cd ${{ secrets.STAGING_APP_PATH }}
          git reset --hard HEAD~1
          pm2 restart all
          pm2 ls
          "