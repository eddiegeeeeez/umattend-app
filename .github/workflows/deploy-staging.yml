name: UMAttend CI/CD Staging Pipeline

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Add SSH key to agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
        run: |
          # Install expect for automated SSH key unlock
          sudo apt-get update && sudo apt-get install -y expect
          
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          eval $(ssh-agent -s)
          
          # Unlock SSH key using passphrase
          cat > /tmp/add-ssh-key.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout -1
          spawn ssh-add /home/runner/.ssh/deploy_key
          expect "Enter passphrase"
          send -- "$env(SSH_PASSPHRASE)\r"
          expect eof
          EOF
          
          chmod +x /tmp/add-ssh-key.exp
          /tmp/add-ssh-key.exp
          
          ssh-add -l
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Deploy via SSH
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
              set -euo pipefail

              APP_PATH='${{ secrets.STAGING_APP_PATH }}'
              REPO_SSH="git@github.com:${{ github.repository }}.git"

              echo "🔐 SSH connection established successfully"

              mkdir -p ~/.ssh
              ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null

              # Check if valid repo exists
              if [ ! -d "$APP_PATH/.git" ]; then
                echo "⚠️  Repository missing or invalid at: $APP_PATH"
                echo "Cleaning and recloning..."
                rm -rf "$APP_PATH"
                mkdir -p "$APP_PATH"
                git clone "$REPO_SSH" "$APP_PATH"
              fi

              cd "$APP_PATH"

              echo "📦 Updating code..."
              BRANCH="${{ github.ref_name }}"
              git fetch origin "$BRANCH" --depth=1
              git reset --hard "origin/$BRANCH"

              echo "⚙️ Setting up environment files..."

              echo "Creating client/.env..."
              mkdir -p client
              cat > client/.env << 'CLIENTENVEOF'
          ${{ secrets.CLIENT_STAGING_ENV_FILE }}
          CLIENTENVEOF
              echo "✅ client/.env created"

              echo "Creating server/.env..."
              mkdir -p server
              cat > server/.env << 'SERVERENVEOF'
          ${{ secrets.SERVER_STAGING_ENV_FILE }}
          SERVERENVEOF
              echo "✅ server/.env created"

              echo "🐳 Rebuilding containers (Staging)..."
              docker compose -f docker-compose.yml -f docker-compose.staging.yml down || true
              docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build --remove-orphans

              echo "✅ Deployment completed successfully!"
              docker compose -f docker-compose.yml -f docker-compose.staging.yml ps
          EOF
