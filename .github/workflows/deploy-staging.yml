name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          umask 077
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Start SSH agent and add key (no passphrase)
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

          # Add server to known hosts
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts || true

          # Test SSH connection
          if ssh -o BatchMode=yes -o ConnectTimeout=10 -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'echo ok' 2>/dev/null; then
            echo "✅ SSH agent authentication succeeded"
          else
            echo ""
            echo "=========================================="
            echo "❌ SSH AUTHENTICATION FAILED"
            echo "=========================================="
            echo ""
            echo "Common causes:"
            echo "1. Public key not in ~/.ssh/authorized_keys on server"
            echo "2. Wrong DEPLOY_USER (current: ${{ secrets.DEPLOY_USER }})"
            echo "3. SSH server config doesn't allow key authentication"
            echo "4. Home directory or .ssh permissions wrong on server"
            echo ""
            echo "To fix:"
            echo "1. SSH to your server manually"
            echo "2. Run: mkdir -p ~/.ssh && chmod 700 ~/.ssh"
            echo "3. Add your public key to ~/.ssh/authorized_keys"
            echo "4. Run: chmod 600 ~/.ssh/authorized_keys"
            echo ""
            echo "Debug output (verbose SSH connection test):"
            ssh -vvv -o BatchMode=yes -o ConnectTimeout=10 -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'echo ok' || true
            exit 1
          fi

      - name: Pull Latest Code
        run: |
          ssh -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_APP_PATH }}
            git fetch --all
            git reset --hard origin/staging
          "

      - name: Build Server
        run: |
          ssh -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_APP_PATH }}/server
            npm install
            npm run prisma:generate
            npm run prisma:migrate:deploy
            npm run build || true
          "

      - name: Build Client
        run: |
          ssh -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_APP_PATH }}/client
            npm install
            npm run build
          "

      - name: Restart PM2 apps
        run: |
          ssh -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_APP_PATH }}
            
            # Server
            pm2 describe umattend-server-staging >/dev/null 2>&1 && pm2 restart umattend-serv
