name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_ASKPASS: /usr/bin/ssh-askpass
        run: |
          set -e
          mkdir -p ~/.ssh
          umask 077
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ASKPASS_SCRIPT=$(mktemp)
          printf '%s\n' '#!/bin/sh' 'echo "${SSH_PASSPHRASE}"' > "$ASKPASS_SCRIPT"
          chmod 700 "$ASKPASS_SCRIPT"

          export SSH_ASKPASS="$ASKPASS_SCRIPT"
          export SSH_PASSPHRASE="${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}"

          eval "$(ssh-agent -s)"
          setsid ssh-add ~/.ssh/id_rsa < /dev/null || true

          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts || true

          if ssh -o BatchMode=yes -o ConnectTimeout=10 -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'echo ok' 2>/dev/null; then
            echo "SSH agent authentication succeeded"
          else
            echo "SSH agent auth failed, attempting to remove key passphrase and retry"
            if [ -n "${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}" ]; then
              ssh-keygen -p -P "${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}" -N "" -f ~/.ssh/id_rsa || true
            fi
            echo "Testing SSH connection with verbose output..."
            if ssh -vvv -o BatchMode=yes -o ConnectTimeout=10 -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'echo ok' 2>&1 | tee /tmp/ssh_debug.log; then
              echo "SSH auth succeeded after removing passphrase"
            else
              echo ""
              echo "=========================================="
              echo "SSH AUTHENTICATION FAILED"
              echo "=========================================="
              echo ""
              echo "Common causes:"
              echo "1. Public key not in ~/.ssh/authorized_keys on server"
              echo "2. Wrong DEPLOY_USER (current: ${{ secrets.DEPLOY_USER }})"
              echo "3. SSH server config doesn't allow key authentication"
              echo "4. Home directory or .ssh permissions wrong on server"
              echo ""
              echo "To fix:"
              echo "1. SSH to your server manually"
              echo "2. Run: mkdir -p ~/.ssh && chmod 700 ~/.ssh"
              echo "3. Add your public key to ~/.ssh/authorized_keys"
              echo "4. Run: chmod 600 ~/.ssh/authorized_keys"
              echo ""
              echo "Debug output (last 30 lines):"
              tail -n 30 /tmp/ssh_debug.log || true
              exit 1
            fi
          fi

          rm -f "$ASKPASS_SCRIPT"

      - name: Create deployment directory
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p ${{ secrets.STAGING_APP_PATH }}"

      - name: Copy project files to server
        run: |
          rsync -avz -e "ssh -p ${{ secrets.DEPLOY_PORT }}" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude '.env' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.STAGING_APP_PATH }}/

      - name: Create environment files
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            echo "${{ secrets.CLIENT_STAGING_ENV_FILE }}" > ${{ secrets.STAGING_APP_PATH }}/client/.env.production
            echo "${{ secrets.SERVER_STAGING_ENV_FILE }}" > ${{ secrets.STAGING_APP_PATH }}/server/.env
          EOF

      - name: Create dummy SSL certificate
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd ${{ secrets.STAGING_APP_PATH }}
            
            mkdir -p certbot/conf/live/${{ secrets.STAGING_DOMAIN }}
            mkdir -p certbot/www
            
            # Create dummy certs only if real ones don't exist
            if [ ! -f "certbot/conf/live/${{ secrets.STAGING_DOMAIN }}/fullchain.pem" ]; then
              echo "Creating dummy certificate for Nginx to start..."
              openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
                -keyout "certbot/conf/live/${{ secrets.STAGING_DOMAIN }}/privkey.pem" \
                -out "certbot/conf/live/${{ secrets.STAGING_DOMAIN }}/fullchain.pem" \
                -subj "/CN=localhost"
            else
              echo "Certificate or dummy already exists."
            fi
          EOF

      - name: Deploy with Docker Compose
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd ${{ secrets.STAGING_APP_PATH }}
            
            docker compose -f docker-compose.staging.yml down
            docker compose -f docker-compose.staging.yml up -d --build
            
            sleep 10
            
            docker compose -f docker-compose.staging.yml exec -T server npm run prisma:migrate:deploy || true
            docker image prune -f
          EOF

      - name: Obtain/Renew SSL certificate
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd ${{ secrets.STAGING_APP_PATH }}

            echo "Requesting Let's Encrypt certificate..."
            
            # Nginx is already running, so --webroot will succeed
            # This command will replace the dummy certs
            docker compose -f docker-compose.staging.yml run --rm --entrypoint "" certbot \
              sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot \
              --email ${{ secrets.LETSENCRYPT_EMAIL }} --agree-tos --no-eff-email --non-interactive \
              -d ${{ secrets.STAGING_DOMAIN }}"

            echo "Reloading Nginx to apply new certificate..."
            docker compose -f docker-compose.staging.yml exec nginx nginx -s reload
          EOF

      - name: Verify deployment
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd ${{ secrets.STAGING_APP_PATH }}
            docker compose -f docker-compose.staging.yml ps
            docker logs umattend-nginx-staging 2>&1 | tail -20
          EOF

      - name: Cleanup
        if: always()
        run: |
          if [ -n "$SSH_AGENT_PID" ]; then
            ssh-agent -k
          fi
          rm -rf ~/.ssh/id_rsa

