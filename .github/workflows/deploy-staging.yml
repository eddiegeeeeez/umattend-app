name: UMAttend CI/CD Staging Pipeline

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Add SSH key to agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
        run: |
          # Install expect for automated SSH key unlock
          sudo apt-get update && sudo apt-get install -y expect
          
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          eval $(ssh-agent -s)
          
          # Unlock SSH key using passphrase
          cat > /tmp/add-ssh-key.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout -1
          spawn ssh-add /home/runner/.ssh/deploy_key
          expect "Enter passphrase"
          send -- "$env(SSH_PASSPHRASE)\r"
          expect eof
          EOF
          
          chmod +x /tmp/add-ssh-key.exp
          /tmp/add-ssh-key.exp
          
          ssh-add -l
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Test SSH Connection
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'echo "SSH connection successful"'

      - name: Setup Repository
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
              set -euo pipefail
              
              APP_PATH='${{ secrets.STAGING_APP_PATH }}'
              REPO_SSH="git@github.com:${{ github.repository }}.git"
              
              echo "Setting up repository..."
              
              # Add GitHub to known hosts
              mkdir -p ~/.ssh
              ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
              
              # Check if valid repo exists
              if [ ! -d "$APP_PATH/.git" ]; then
                echo "Repository missing or invalid at: $APP_PATH"
                echo "Cleaning and recloning..."
                rm -rf "$APP_PATH"
                mkdir -p "$APP_PATH"
                git clone "$REPO_SSH" "$APP_PATH"
              fi
              
              echo "Repository ready"
          EOF

      - name: Pull Latest Code
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
              set -euo pipefail
              
              APP_PATH='${{ secrets.STAGING_APP_PATH }}'
              BRANCH="${{ github.ref_name }}"
              
              cd "$APP_PATH"
              
              echo "Fetching latest code from $BRANCH..."
              git fetch origin "$BRANCH" --depth=1
              git reset --hard "origin/$BRANCH"
              
              echo "Code updated to latest commit"
          EOF

      - name: Create Environment Files
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
              set -euo pipefail
              
              APP_PATH='${{ secrets.STAGING_APP_PATH }}'
              
              cd "$APP_PATH"
              
              echo "Creating environment files..."
              
              # Create client .env
              echo "Creating client/.env..."
              mkdir -p client
              cat > client/.env << 'CLIENTENVEOF'
          ${{ secrets.CLIENT_STAGING_ENV_FILE }}
          CLIENTENVEOF
              echo "client/.env created"
              
              # Create server .env
              echo "Creating server/.env..."
              mkdir -p server
              cat > server/.env << 'SERVERENVEOF'
          ${{ secrets.SERVER_STAGING_ENV_FILE }}
          SERVERENVEOF
              echo "server/.env created"
          EOF

      - name: Stop Existing Containers
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
              set -euo pipefail
              
              APP_PATH='${{ secrets.STAGING_APP_PATH }}'
              
              cd "$APP_PATH"
              
              echo "Stopping existing containers..."
              docker compose -f docker-compose.staging.yml down || true
              
              echo "Containers stopped"
          EOF

      - name: Build and Start Containers
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
              set -euo pipefail
              
              APP_PATH='${{ secrets.STAGING_APP_PATH }}'
              
              cd "$APP_PATH"
              
              echo "Building and starting containers..."
              docker compose -f docker-compose.staging.yml up -d --build --remove-orphans
              
              echo "Containers built and started"
          EOF

      - name: Issue/Ensure Let's Encrypt Certificate (Staging)
        env:
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
          EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
              set -euo pipefail

              APP_PATH='${{ secrets.STAGING_APP_PATH }}'
              DOMAIN='${{ env.DOMAIN }}'
              EMAIL='${{ env.EMAIL }}'

              if [ -z "$DOMAIN" ] || [ -z "$EMAIL" ]; then
                echo "STAGING_DOMAIN and LETSENCRYPT_EMAIL secrets are required" >&2
                exit 1
              fi

              cd "$APP_PATH"

              echo "Ensuring nginx and certbot services are up..."
              docker compose -f docker-compose.staging.yml up -d nginx certbot

              echo "Requesting certificate for $DOMAIN if missing..."
              docker compose -f docker-compose.staging.yml run --rm certbot \
                certbot certonly --webroot -w /var/www/certbot -d "$DOMAIN" \
                --email "$EMAIL" --agree-tos --no-eff-email --keep-until-expiring --expand

              echo "Reloading nginx to pick up certificates..."
              docker compose -f docker-compose.staging.yml exec -T nginx nginx -s reload || \
              docker compose -f docker-compose.staging.yml restart nginx
          EOF

      - name: Verify Deployment
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
              set -euo pipefail
              
              APP_PATH='${{ secrets.STAGING_APP_PATH }}'
              
              cd "$APP_PATH"
              
              echo "Checking container status..."
              docker compose -f docker-compose.staging.yml ps
              
              echo "Checking certificate files..."
              DOMAIN='${{ secrets.STAGING_DOMAIN }}'
              if [ -n "$DOMAIN" ]; then
                docker compose -f docker-compose.staging.yml run --rm certbot \
                  certbot certificates || true
              fi
              
              echo ""
              echo "Staging deployment completed successfully!"
          EOF
