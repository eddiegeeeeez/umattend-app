name: UMAttend CI/CD Staging Pipeline

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Await Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: wbert,riomar0001
          minimum-approvals: 1
          issue-title: "Deploying to Staging Environment"
          issue-body: "Please approve or deny the staging deployment of branch `${{ github.ref_name }}`."

      - name: Setup SSH Key with Passphrase
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
        run: |
          # Install expect
          sudo apt-get update && sudo apt-get install -y expect
          
          # Create SSH directory and key file
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Start ssh-agent
          eval $(ssh-agent -s)
          
          # Create expect script to add key with passphrase
          cat > /tmp/add-ssh-key.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout -1
          spawn ssh-add /home/runner/.ssh/deploy_key
          expect "Enter passphrase"
          send -- "$env(SSH_PASSPHRASE)\r"
          expect eof
          EOF
          
          chmod +x /tmp/add-ssh-key.exp
          /tmp/add-ssh-key.exp
          
          # Verify key is loaded
          ssh-add -l
          
          # Save agent info for later steps
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Deploy via SSH
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
              set -euo pipefail

              APP_PATH='${{ secrets.STAGING_APP_PATH }}'

              echo "SSH OK"
              
              # Create directory if it doesn't exist
              if [ ! -d "$APP_PATH" ]; then
                echo "Creating directory: $APP_PATH"
                mkdir -p "$APP_PATH"
                echo "Cloning repository..."
                git clone https://github.com/${{ github.repository }}.git "$APP_PATH"
              fi
              
              cd "$APP_PATH"

              echo "Updating code..."
              BRANCH="${{ github.ref_name }}"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"

              echo "Setting up environment files..."
              
              echo "Creating client/.env from CLIENT_ENV_FILE secret..."
              cat > client/.env << 'CLIENTENVEOF'
          ${{ secrets.CLIENT_STAGING_ENV_FILE }}
          CLIENTENVEOF
              echo "✓ Created client/.env"

              echo "Creating server/.env from SERVER_ENV_FILE secret..."
              cat > server/.env << 'SERVERENVEOF'
          ${{ secrets.SERVER_STAGING_ENV_FILE }}
          SERVERENVEOF
              echo "✓ Created server/.env"

              echo "Rebuilding with Docker Compose (Staging)..."
              docker compose -f docker-compose.yml -f docker-compose.staging.yml down || true
              docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build --remove-orphans
              
              echo "✅ Staging deployment complete!"
              docker compose -f docker-compose.yml -f docker-compose.staging.yml ps
          EOF
