name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          umask 077

          # Write SSH private key from secrets
          echo "${{ secrets.AZURE_DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Start SSH agent and add key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

          # Add server to known hosts
          ssh-keyscan -p ${{ secrets.AZURE_DEPLOY_HOST }} -H ${{ secrets.AZURE_DEPLOY_HOST }} >> ~/.ssh/known_hosts

          # Test SSH connection
          if ssh -o BatchMode=yes -o ConnectTimeout=10 -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} 'echo ok' 2>/dev/null; then
            echo "SSH connection successful"
          else
            echo "SSH connection failed — please verify authorized_keys and permissions on the server"
            exit 1
          fi

      - name: Pull Latest Code
        run: |
          ssh -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_APP_PATH }}
            git fetch --all
            git reset --hard origin/staging
          "

      - name: Build Server
        run: |
          ssh -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_APP_PATH }}/server
            npm install
            npm run prisma:generate
            npm run prisma:migrate:deploy
            npm run build || true
          "

      - name: Build Client
        run: |
          ssh -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_APP_PATH }}/client
            npm install
            npm run build
          "

      - name: Restart PM2 apps
        run: |
          ssh -p ${{ secrets.AZURE_DEPLOY_PORT }} ${{ secrets.AZURE_DEPLOY_USER }}@${{ secrets.AZURE_DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_APP_PATH }}
            
            # Server
            pm2 describe umattend-server-staging >/dev/null 2>&1 && pm2 restart umattend-serv
