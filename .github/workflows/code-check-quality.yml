name: PR Code Quality Check

on:
  pull_request:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      # --- CLIENT ---
      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Run ESLint (client)
        working-directory: ./client
        run: npx eslint . --ext .js,.ts,.jsx,.tsx

      - name: Check code formatting with Prettier (client)
        working-directory: ./client
        run: npx prettier --check .

      - name: Type-check with TypeScript (client)
        working-directory: ./client
        run: npx tsc --noEmit

      # --- SERVER ---
      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run ESLint (server)
        working-directory: ./server
        run: npx eslint . --ext .js,.ts,.jsx,.tsx

      - name: Check code formatting with Prettier (server)
        working-directory: ./server
        run: npx prettier --check .

      - name: Type-check with TypeScript (server)
        working-directory: ./server
        run: npx tsc --noEmit
