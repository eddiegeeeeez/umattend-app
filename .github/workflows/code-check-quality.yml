name: PR Code Quality Check

on:
  pull_request:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            client/yarn.lock
            server/package-lock.json
            server/yarn.lock

      # ------------------ CLIENT ------------------
      - name: Install client dependencies
        working-directory: ./client
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint (client)
        id: eslint_client
        continue-on-error: true
        working-directory: ./client
        run: npx eslint . --ext .js,.ts,.jsx,.tsx

      - name: Check code formatting with Prettier (client)
        id: prettier_client
        continue-on-error: true
        working-directory: ./client
        run: npx prettier --check .

      - name: Type-check with TypeScript (client)
        id: tsc_client
        continue-on-error: true
        working-directory: ./client
        run: npx tsc --noEmit

      # ------------------ SERVER ------------------
      - name: Install server dependencies
        working-directory: ./server
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint (server)
        id: eslint_server
        continue-on-error: true
        working-directory: ./server
        run: npx eslint . --ext .js,.ts,.jsx,.tsx

      - name: Check code formatting with Prettier (server)
        id: prettier_server
        continue-on-error: true
        working-directory: ./server
        run: npx prettier --check .

      - name: Type-check with TypeScript (server)
        id: tsc_server
        continue-on-error: true
        working-directory: ./server
        run: npx tsc --noEmit

      # ------------------ SUMMARY ------------------
      - name: Summarize results
        if: always()
        run: |
          echo "----- CLIENT CHECKS -----"
          echo "ESLint (client): ${{ steps.eslint_client.outcome }}"
          echo "Prettier (client): ${{ steps.prettier_client.outcome }}"
          echo "TypeScript (client): ${{ steps.tsc_client.outcome }}"
          echo ""
          echo "----- SERVER CHECKS -----"
          echo "ESLint (server): ${{ steps.eslint_server.outcome }}"
          echo "Prettier (server): ${{ steps.prettier_server.outcome }}"
          echo "TypeScript (server): ${{ steps.tsc_server.outcome }}"

          # Fail the workflow if any check failed
          if [ "${{ steps.eslint_client.outcome }}" = "failure" ] || \
             [ "${{ steps.prettier_client.outcome }}" = "failure" ] || \
             [ "${{ steps.tsc_client.outcome }}" = "failure" ] || \
             [ "${{ steps.eslint_server.outcome }}" = "failure" ] || \
             [ "${{ steps.prettier_server.outcome }}" = "failure" ] || \
             [ "${{ steps.tsc_server.outcome }}" = "failure" ]; then
            echo "One or more code quality checks failed."
            exit 1
          else
            echo "All code quality checks passed successfully!"
          fi
