name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_ASKPASS: /usr/bin/ssh-askpass
        run: |
          set -e
          mkdir -p ~/.ssh
          umask 077
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ASKPASS_SCRIPT=$(mktemp)
          printf '%s\n' '#!/bin/sh' 'echo "${SSH_PASSPHRASE}"' > "$ASKPASS_SCRIPT"
          chmod 700 "$ASKPASS_SCRIPT"

          export SSH_ASKPASS="$ASKPASS_SCRIPT"
          export SSH_PASSPHRASE="${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}"

          eval "$(ssh-agent -s)"
          setsid ssh-add ~/.ssh/id_rsa < /dev/null || true

          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts || true

          if ssh -o BatchMode=yes -o ConnectTimeout=10 -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'echo ok' 2>/dev/null; then
            echo "SSH agent authentication succeeded"
          else
            echo "SSH agent auth failed — attempting to remove key passphrase and retry"
            if [ -n "${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}" ]; then
              ssh-keygen -p -P "${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}" -N "" -f ~/.ssh/id_rsa || true
            fi
            
            echo "Testing SSH connection with verbose output..."
            if ssh -vvv -o BatchMode=yes -o ConnectTimeout=10 -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'echo ok' 2>&1 | tee /tmp/ssh_debug.log; then
              echo "SSH auth succeeded after removing passphrase"
            else
              echo ""
              echo "=========================================="
              echo "SSH AUTHENTICATION FAILED"
              echo "=========================================="
              echo ""
              echo "Common causes:"
              echo "1. Public key not in ~/.ssh/authorized_keys on server"
              echo "2. Wrong DEPLOY_USER (current: ${{ secrets.DEPLOY_USER }})"
              echo "3. SSH server config doesn't allow key authentication"
              echo "4. Home directory or .ssh permissions wrong on server"
              echo ""
              echo "To fix:"
              echo "1. SSH to your server manually"
              echo "2. Run: mkdir -p ~/.ssh && chmod 700 ~/.ssh"
              echo "3. Add your public key to ~/.ssh/authorized_keys"
              echo "4. Run: chmod 600 ~/.ssh/authorized_keys"
              echo ""
              echo "Debug output (last 30 lines):"
              tail -n 30 /tmp/ssh_debug.log || true
              exit 1
            fi
          fi

          rm -f "$ASKPASS_SCRIPT"

      - name: Pull Catest Code
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.PRODUCTION_APP_PATH }}
            git fetch --all
            git reset --hard origin/main
          "

      - name: Building Server
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.PRODUCTION_APP_PATH }}/server
            npm install
            npm run prisma:generate
            npm run prisma:migrate:deploy
            npm run build || true
          "

      - name: Build Client
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.PRODUCTION_APP_PATH }}/client
            npm install
            npm run build
          "

      - name: Restart PM2 apps
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.PRODUCTION_APP_PATH }}

            # Server
            pm2 describe umattend-server-prod >/dev/null 2>&1 && pm2 restart umattend-server-prod || pm2 start server --name umattend-server-prod -- start

            # Client
            pm2 describe umattend-client-prod >/dev/null 2>&1 && pm2 restart umattend-client-prod || pm2 start client --name umattend-client-prod -- start

            pm2 save
          "

      - name: Verify deployment
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.PRODUCTION_APP_PATH }}
            pm2 ls
          "
