name: UMAttend CI/CD Staging Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup SSH Key with Passphrase
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
        run: |
          sudo apt-get update && sudo apt-get install -y expect

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          eval $(ssh-agent -s)

          cat > /tmp/add-ssh-key.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout -1
          spawn ssh-add /home/runner/.ssh/deploy_key
          expect "Enter passphrase"
          send -- "$env(SSH_PASSPHRASE)\r"
          expect eof
          EOF

          chmod +x /tmp/add-ssh-key.exp
          /tmp/add-ssh-key.exp

          ssh-add -l

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Deploy via SSH
        run: |
          ssh -T \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
              set -euo pipefail

              APP_PATH='${{ secrets.PRODUCTION_APP_PATH }}'
              REPO_SSH="git@github.com:${{ github.repository }}.git"

              echo "SSH OK"

              # Ensure GitHub host key is known
              mkdir -p ~/.ssh
              ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null

              # Clone or update repository via SSH
              if [ ! -d "$APP_PATH/.git" ]; then
                echo "Cloning repository via SSH..."
                git clone "$REPO_SSH" "$APP_PATH"
              fi

              cd "$APP_PATH"

              echo "Updating code..."
              BRANCH="${{ github.ref_name }}"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"

              echo "Setting up environment files..."

              echo "Creating client/.env from CLIENT_ENV_FILE secret..."
              cat > client/.env << 'CLIENTENVEOF'
          ${{ secrets.CLIENT_PRODUCTION_ENV_FILE }}
          CLIENTENVEOF
              echo "✓ Created client/.env"

              echo "Creating server/.env from SERVER_ENV_FILE secret..."
              cat > server/.env << 'SERVERENVEOF'
          ${{ secrets.SERVER_PRODUCTION_ENV_FILE }}
          SERVERENVEOF
              echo "✓ Created server/.env"

              echo "Rebuilding with Docker Compose (Production)..."
              docker compose -f docker-compose.yml -f docker-compose.production.yml down || true
              docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build --remove-orphans

              echo "✅ Production deployment complete!"
              docker compose -f docker-compose.yml -f docker-compose.production.yml ps
          EOF
