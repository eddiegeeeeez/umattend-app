user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;

  # gzip for text assets
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
  gzip_min_length 1024;

  # Upstreams are Docker service names on the same network
  upstream client_upstream {
    server client:3000;
    keepalive 32;
  }

  upstream server_upstream {
    server server:4000;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # --- API → Express/Prisma
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      proxy_pass http://server_upstream;
    }

    # Cache Next.js static assets aggressively
    location ~* ^/_next/static/ {
      proxy_pass http://client_upstream;
      proxy_cache_valid 200 365d;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static (adjust path if you host via Next)
    location /public/ {
      proxy_pass http://client_upstream;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    # Everything else → Next.js
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      proxy_pass http://client_upstream;
    }
  }
}

