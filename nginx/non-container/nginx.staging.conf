# ===========================
# NGINX CONFIG - STAGING
# Directory: /home/umattend/umattend-staging
# Domain: umattend-env-staging.vintasystem.com
# ===========================

server {
    listen 80;
    server_name umattend-env-staging.vintasystem.com;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name umattend-env-staging.vintasystem.com;

    # Next.js frontend (staging)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Express API (staging)
    location /api/v1/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: Healthcheck for staging
    location /health {
        proxy_pass http://localhost:4000/health;
    }
}
