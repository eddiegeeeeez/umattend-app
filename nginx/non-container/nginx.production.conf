# =========================================================
# Directory: /home/umattend/umattend-production
# Domain: umattend.site www.umattend.site
# =========================================================

server {
    server_name umattend.site www.umattend.site;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;


   # Next.js frontend
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }


    # Express API
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/umattend_access.log;
    error_log /var/log/nginx/umattend_error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/umattend.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/umattend.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    listen 80;
    server_name umattend.site www.umattend.site;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}


server {
    if ($host = www.umattend.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = umattend.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name umattend.site www.umattend.site;
    return 404; # managed by Certbot
}
