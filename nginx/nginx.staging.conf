# Nginx Configuration for STAGING Environment
# Optimized for development and testing

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  
  # Logging
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;

  # Performance
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types 
    text/plain 
    text/css 
    text/xml
    text/javascript
    application/json 
    application/javascript 
    application/x-javascript
    application/xml 
    application/xml+rss 
    application/rss+xml
    application/atom+xml
    image/svg+xml;
  gzip_min_length 1024;

  # Upstreams - Docker service names on the same network
  upstream client_upstream {
    server client:3000;
    keepalive 32;
  }

  upstream server_upstream {
    server server:4000;
    keepalive 32;
  }

  # WebSocket support
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # HTTP server - redirect to HTTPS
  server {
    listen 80;
    server_name umattend-env-staging.vintasystem.com;
    
    # ACME challenge endpoint for Let's Encrypt (served over HTTP)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      try_files $uri =404;
    }

    # Health check (allow HTTP)
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server
  server {
    listen 443 ssl;
    server_name umattend-env-staging.vintasystem.com;
    
    # SSL certificates provided by Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/umattend-env-staging.vintasystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umattend-env-staging.vintasystem.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Increase client body size for file uploads
    client_max_body_size 10M;
    
    # Security headers (relaxed for staging)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check endpoint
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # ACME challenge (also allow over HTTPS just in case)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      try_files $uri =404;
    }

    # API routes → Express/Prisma backend
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      
      # Timeouts (relaxed for staging/debugging)
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      
      proxy_pass http://server_upstream;
    }

    # Next.js static assets - moderate caching for staging
    location ~* ^/_next/static/ {
      proxy_pass http://client_upstream;
      proxy_cache_valid 200 7d;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    # Next.js image optimization
    location ~* ^/_next/image/ {
      proxy_pass http://client_upstream;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    # Public static files
    location /public/ {
      proxy_pass http://client_upstream;
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
    }

    # Favicon
    location = /favicon.ico {
      proxy_pass http://client_upstream;
      expires 7d;
      access_log off;
    }

    # Everything else → Next.js
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      
      # Timeouts
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      
      proxy_pass http://client_upstream;
    }
  }
}
