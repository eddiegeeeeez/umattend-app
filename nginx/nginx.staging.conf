user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 100;
  types_hash_max_size 2048;
  client_max_body_size 10M;

  # Prevent timeouts and connection resets
  proxy_connect_timeout 60s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  proxy_buffering on;
  proxy_buffer_size 4k;
  proxy_buffers 8 4k;
  proxy_busy_buffers_size 8k;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/x-javascript
             application/xml application/xml+rss application/rss+xml
             application/atom+xml image/svg+xml;
  gzip_min_length 1024;
  gzip_disable "msie6";

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

  upstream client_upstream {
    server client:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  upstream server_upstream {
    server server:4000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # HTTP server
  server {
    listen 80 default_server;
    server_name _;

    # ACME challenge endpoint
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      try_files $uri =404;
      access_log off;
    }

    # Health check
    location = /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Redirect to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server
  server {
    listen 443 ssl http2 default_server;
    server_name umattend-env-staging.vintasystem.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/umattend-env-staging.vintasystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umattend-env-staging.vintasystem.com/privkey.pem;

    # Fallback if cert missing
    ssl_trusted_certificate /etc/letsencrypt/live/umattend-env-staging.vintasystem.com/chain.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check
    location = /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # ACME challenge
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      try_files $uri =404;
      access_log off;
    }

    # API routes
    location /api/ {
      limit_req zone=api burst=20 nodelay;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;

      proxy_pass http://server_upstream;
      proxy_http_version 1.1;
    }

    # Next.js static assets
    location ~* ^/_next/static/ {
      proxy_pass http://client_upstream;
      proxy_cache_valid 200 7d;
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
      access_log off;
    }

    # Next.js image optimization
    location ~* ^/_next/image/ {
      proxy_pass http://client_upstream;
      proxy_cache_valid 200 7d;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      access_log off;
    }

    # Public static files
    location /public/ {
      proxy_pass http://client_upstream;
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
      access_log off;
    }

    # Favicon
    location = /favicon.ico {
      proxy_pass http://client_upstream;
      expires 7d;
      access_log off;
    }

    # Everything else to Next.js
    location / {
      limit_req zone=general burst=50 nodelay;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;

      proxy_pass http://client_upstream;
      proxy_http_version 1.1;
    }

    # Deny access to sensitive files
    location ~ /\. {
      deny all;
      access_log off;
    }

    location ~ /\.env {
      deny all;
      access_log off;
    }
  }
}