# Nginx Configuration for PRODUCTION Environment
# Optimized for performance, security, and reliability

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  2048;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  
  # Logging
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
  access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;

  # Performance optimizations
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  30;
  keepalive_requests 100;
  types_hash_max_size 2048;
  server_tokens off;  # Hide nginx version

  # Buffer sizes
  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 16k;
  output_buffers 1 32k;
  postpone_output 1460;

  # Gzip compression (aggressive)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types 
    text/plain 
    text/css 
    text/xml
    text/javascript
    application/json 
    application/javascript 
    application/x-javascript
    application/xml 
    application/xml+rss 
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/truetype
    font/opentype
    application/vnd.ms-fontobject;
  gzip_min_length 1024;
  gzip_disable "msie6";

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=addr:10m;

  # Upstreams - Docker service names on the same network
  upstream client_upstream {
    server client:3000 max_fails=3 fail_timeout=30s;
    keepalive 64;
    keepalive_requests 100;
    keepalive_timeout 60s;
  }

  upstream server_upstream {
    server server:4000 max_fails=3 fail_timeout=30s;
    keepalive 64;
    keepalive_requests 100;
    keepalive_timeout 60s;
  }

  # WebSocket support
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Cache settings
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:100m 
                   max_size=1g inactive=30d use_temp_path=off;

  # HTTP server - redirect to HTTPS
  server {
    listen 80;
    server_name umattend.vintasystem.com; # TODO: adjust to your production domain
    
    # ACME challenge endpoint for Let's Encrypt (served over HTTP)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      try_files $uri =404;
    }

    # Health check (allow HTTP)
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server
  server {
    listen 443 ssl http2;
    server_name umattend.vintasystem.com;  # Replace with your domain
    
    # SSL certificates provided by Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/umattend.vintasystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umattend.vintasystem.com/privkey.pem;
    
    # SSL configuration (modern, secure)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Client body size
    client_max_body_size 10M;
    
    # Security headers (strict)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Rate limiting
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 10;

    # Health check endpoint
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # ACME challenge (also allow over HTTPS)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      try_files $uri =404;
    }

    # API routes → Express/Prisma backend
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      
      # Timeouts
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      
      # Buffering
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      proxy_busy_buffers_size 8k;
      
      proxy_pass http://server_upstream;
    }

    # Next.js static assets - aggressive caching
    location ~* ^/_next/static/ {
      proxy_pass http://client_upstream;
      proxy_cache static_cache;
      proxy_cache_valid 200 365d;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_lock on;
      
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Cache-Status $upstream_cache_status;
      
      access_log off;
    }

    # Next.js image optimization
    location ~* ^/_next/image/ {
      proxy_pass http://client_upstream;
      proxy_cache static_cache;
      proxy_cache_valid 200 30d;
      
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Public static files
    location /public/ {
      proxy_pass http://client_upstream;
      proxy_cache static_cache;
      proxy_cache_valid 200 7d;
      
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Favicon
    location = /favicon.ico {
      proxy_pass http://client_upstream;
      expires 30d;
      access_log off;
    }

    # Robots.txt
    location = /robots.txt {
      proxy_pass http://client_upstream;
      expires 7d;
      access_log off;
    }

    # Everything else → Next.js
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      
      # Timeouts
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      
      # Buffering
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      
      proxy_pass http://client_upstream;
    }
  }
}
