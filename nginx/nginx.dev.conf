# Nginx Configuration for DEVELOPMENT Environment
# Optimized for local development with hot-reload support

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log debug;
pid        /var/run/nginx.pid;

events {
  worker_connections  512;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  
  # Logging
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
  access_log  /var/log/nginx/access.log  main;

  # Performance
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_comp_level 4;
  gzip_types text/plain text/css application/json application/javascript text/xml;

  # Upstreams - Docker service names
  upstream client_upstream {
    server client:3000;
  }

  upstream server_upstream {
    server server:4000;
  }

  # WebSocket support for Next.js HMR
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Development server configuration
  server {
    listen 80;
    server_name _;
    
    # Large client body size for development
    client_max_body_size 50M;

    # Health check endpoint
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # API routes → Express/Prisma backend
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      
      # Long timeouts for debugging
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      
      # Disable buffering for real-time logs
      proxy_buffering off;
      
      proxy_pass http://server_upstream;
    }

    # Next.js HMR WebSocket
    location /_next/webpack-hmr {
      proxy_pass http://client_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      
      # Long timeout for HMR connection
      proxy_read_timeout 86400;
    }

    # Everything else → Next.js (with HMR support)
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      
      # Long timeouts for debugging
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      
      # Disable caching in development
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
      
      proxy_pass http://client_upstream;
    }
  }
}
