# Production Environment Configuration
# This file contains production-specific overrides

networks:
  appnet:
    driver: bridge

volumes:
  letsencrypt:
  certbot-www:

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 20.11.1
    container_name: umattend_server_production
    restart: always
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: ${SERVER_PORT:-4000}
    networks: [appnet]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 20.11.1
        API_URL: http://server:4000
    container_name: umattend_client_production
    restart: always
    env_file:
      - ./client/.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: ${CLIENT_PORT:-3000}
      # Override API_URL to use Docker service name
      API_URL: http://server:4000
    depends_on:
      server:
        condition: service_healthy
    networks: [appnet]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  nginx:
    image: nginx:1.25.5-alpine
    container_name: umattend_nginx_production
    restart: always
    depends_on:
      - client
      - server
    ports:
      - "80:80"
      - "443:443"  # Production uses HTTPS
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./nginx/logs:/var/log/nginx
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot:latest
    container_name: umattend_certbot_production
    restart: unless-stopped
    depends_on:
      - nginx
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "tail -f /dev/null"
    networks: [appnet]
